<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elmall · Bàn làm việc kinh doanh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Tinos:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f3ee; --panel:#ffffff; --ink:#1b2333; --ink2:#4a5468; --mute:#8a92a3; --line:#e4e0d6;
  --navy:#16233f; --navy2:#22345c; --amber:#f0a81c; --amber-soft:#fff4dc;
  --green:#1f8a5b; --green-soft:#e3f4ec; --red:#c8402f; --red-soft:#fbe7e3; --blue:#2c64c6; --blue-soft:#e6eefb;
  --r:12px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,sans-serif;font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:var(--navy);color:#dfe5f1;padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px}
.bulb{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ffe7a8,var(--amber) 60%,#c27d00);box-shadow:0 0 18px rgba(240,168,28,.55)}
.brand b{display:block;font-size:17px;color:#fff;letter-spacing:.3px}
.brand small{color:#9fb0cf;font-size:12px}
.nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;border:0;background:transparent;color:#cbd4e6;text-align:left;width:100%;font-weight:500}
.nav:hover{background:rgba(255,255,255,.06)}
.nav.on{background:var(--amber);color:var(--navy);font-weight:700}
.nav .ic{width:20px;text-align:center}
.nav .badge{margin-left:auto;background:var(--red);color:#fff;font-size:11px;border-radius:10px;padding:1px 7px;font-weight:700}
.nav.on .badge{background:var(--navy);color:var(--amber)}
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}#gate[hidden],.app[hidden]{display:none}
.gcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px;max-width:420px;width:100%;text-align:center;box-shadow:0 10px 30px rgba(20,30,50,.08)}.gcard h2{margin:6px 0}.gcard p{color:var(--ink2)}
#userbox{margin-top:auto;padding:10px 6px 0;border-top:1px solid rgba(255,255,255,.1)}
.ub{display:flex;gap:8px;align-items:center}.ub img,.ub .av{width:32px;height:32px;border-radius:50%;flex:none}.ub .av{background:var(--amber);color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:800}
.ub b{display:block;color:#fff;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:120px}.ub small{color:#9fb0cf;font-size:11.5px}.ub .btn{color:#cbd4e6}
.scope{display:flex;gap:4px;margin-top:8px}.scope .chip{font-size:12px;padding:3px 10px;background:transparent;color:#cbd4e6;border-color:rgba(255,255,255,.2)}.scope .chip.on{background:var(--amber);color:var(--navy);border-color:var(--amber)}
.otag{font-size:11.5px;background:#eef1f7;color:var(--navy2);border-radius:6px;padding:1px 7px;font-weight:600}
body.staff .adm,body.nocost .cst{display:none!important}
.sync{font-size:12px;color:#9fb0cf;padding:8px}
.sync i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#888;margin-right:6px}
.sync.ok i{background:#3ccf86}.sync.err i{background:#ff6b5a}
main{padding:26px 30px 90px;max-width:1200px;width:100%}
h1{font-size:24px;margin:0 0 4px;font-weight:800}
.sub{color:var(--ink2);margin:0 0 20px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;cursor:pointer}
.kpi b{font-size:28px;display:block;font-weight:800}
.kpi span{color:var(--ink2);font-size:13px}
.kpi.warn b{color:var(--red)} .kpi.amb b{color:#b57800}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;font-weight:600}
.btn:hover{border-color:var(--ink2)}
.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.pri:hover{background:var(--navy2)}
.btn.amb{background:var(--amber);border-color:var(--amber);color:var(--navy)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--red)}
.btn:disabled{opacity:.5;cursor:default}
input,select,textarea{border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:#fff;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--amber);outline-offset:-1px;border-color:var(--amber)}
label.f{display:block;font-size:13px;color:var(--ink2);font-weight:600}
label.f>input,label.f>select,label.f>textarea{margin-top:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.sec{margin:22px 0 10px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.sec .n{background:var(--line);border-radius:10px;padding:0 8px;font-size:12px}
.todo{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-bottom:1px solid var(--line)}
.todo:last-child{border-bottom:0}
.todo .dot{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none}
.todo .t{font-weight:600}
.todo .d{font-size:13px;color:var(--ink2)}
.chk{width:20px;height:20px;flex:none;margin-top:2px;accent-color:var(--green)}
.tag{display:inline-block;font-size:12px;font-weight:600;border-radius:6px;padding:2px 8px;background:var(--line);color:var(--ink2)}
.tag.red{background:var(--red-soft);color:var(--red)} .tag.green{background:var(--green-soft);color:var(--green)}
.tag.amb{background:var(--amber-soft);color:#996500} .tag.blue{background:var(--blue-soft);color:var(--blue)}
.empty{color:var(--mute);text-align:center;padding:26px 10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:5px 12px;font-size:13px;font-weight:600}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.order{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:10px}
.order.late{border-left:4px solid var(--red)}
.order h3{margin:0;font-size:16px}
.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:12px 0 8px}
.step{border:0;background:#eeebe3;border-radius:6px;padding:7px 4px;font-size:12px;font-weight:600;color:var(--ink2);position:relative}
.step.done{background:var(--green-soft);color:var(--green)}
.step.cur{background:var(--amber);color:var(--navy)}
.step:hover{outline:2px solid var(--navy2)}
.money{font-variant-numeric:tabular-nums;white-space:nowrap}
table{border-collapse:collapse;width:100%}
th{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--mute);text-align:left;padding:8px;border-bottom:1px solid var(--line);font-weight:600}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
td.r,th.r{text-align:right}
.tbl-wrap{overflow-x:auto}
.search{position:relative}
.search input.big{font-size:17px;padding:13px 14px 13px 42px}
.search .mag{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--mute)}
.results{position:absolute;left:0;right:0;top:calc(100% + 4px);background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:0 12px 30px rgba(20,30,50,.15);max-height:420px;overflow:auto;z-index:20}
.res{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:12px}
.res:hover,.res.hl{background:var(--amber-soft)}
.pname{font-weight:700}
.specs{font-size:13px;color:var(--ink2)}
.specs span+span::before{content:" · ";color:var(--mute)}
.res.bia{border-left:4px solid #7b3fb8;background:#faf5ff}.res.bia:hover,.res.bia.hl{background:#efe3fb}
.pcard.bia{border-left:5px solid #7b3fb8;background:#fcf9ff}
.lines tr.bia td{background:#f6effd}.lines tr.bia td:first-child{box-shadow:inset 4px 0 0 #7b3fb8}
.tag.bia{background:#efe3fb;color:#6a2fa6;font-weight:700}
.biarow{margin-top:5px;font-size:13px;color:#6a2fa6;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.biarow input{width:105px;padding:4px 7px!important;font-size:13px!important;text-align:right;border-color:#cdb3ea}
.biarow input.ck{width:58px}
.bianote{color:#6a2fa6;font-size:12.5px}
.note{font-size:12.5px;color:#8a5a00;background:var(--amber-soft);border-radius:6px;padding:2px 7px;display:inline-block;margin-top:3px}
.pcard{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.spec-tbl{font-size:13px;width:100%}
.spec-tbl td{padding:3px 0;border:0}
.spec-tbl td:first-child{color:var(--mute);width:42%}
.price-row{display:flex;justify-content:space-between;align-items:end;border-top:1px dashed var(--line);padding-top:8px;margin-top:auto}
.lines input{padding:6px 8px;font-size:14px}
.lines td{vertical-align:middle}
.tot{margin-left:auto;max-width:360px}
.thumb{width:44px;height:44px;border:1px dashed #c9c2b1;border-radius:7px;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;background:#fffdf8;font-size:16px;color:var(--mute)}
.thumb img{width:100%;height:100%;object-fit:contain}
.inote{font-size:12px;color:var(--mute)}
.pimg{width:56px;height:56px;object-fit:contain;flex:none;border-radius:6px;background:#fff}
.pcard .top{display:flex;gap:10px;align-items:flex-start}
.navg{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:#7f8fb0;padding:12px 12px 4px;font-weight:700}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.cols{display:grid;grid-template-columns:1.15fr 1fr;gap:16px;align-items:start}
.box{background:#fff;border:1px solid var(--line);border-radius:var(--r);margin-bottom:16px;overflow:hidden}
.box .bh{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--line);background:#fcfbf8}
.box .bh .n{background:var(--line);border-radius:10px;padding:0 8px;font-size:12px;font-weight:700}
.li{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}.li .t{font-weight:600}.li .d{font-size:12.5px;color:var(--ink2)}
.li .acts{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.li.done .t{text-decoration:line-through;color:var(--mute)}
.li .dot{width:9px;height:9px;border-radius:50%;flex:none}
.subh{padding:8px 14px;font-size:13px;font-weight:700;background:var(--blue-soft);color:var(--blue)}
.empty.sm{padding:14px;font-size:13.5px}
.more{padding:8px 14px}
.qadd{display:flex;gap:6px;padding:10px 14px;border-top:1px dashed var(--line);background:#fcfbf8}
.qadd input{padding:6px 9px;font-size:14px}.qadd input[type=date]{width:150px}
.day{display:flex;gap:12px;padding:9px 14px;border-bottom:1px solid var(--line);font-size:13.5px}
.day:last-child{border-bottom:0}.day .dl{width:64px;color:var(--ink2);font-size:12px;flex:none}
.dchips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:5px}
.logl{font-size:13px;color:var(--ink2);margin-top:4px}
.ctab td{font-size:13px;padding:6px}.ctab th{padding:6px;white-space:nowrap}.ctab .cnote{min-width:260px}
.cctpick{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-top:5px;font-size:12.5px;color:var(--ink2)}
.cctpick .chip{padding:3px 10px;font-size:12.5px}.cctpick.need{background:var(--red-soft);border-radius:8px;padding:4px 6px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mgrid .btn{padding:14px 6px}
.kpi[data-go]{cursor:pointer}
.tot div{display:flex;justify-content:space-between;padding:4px 0}
.tot .big{font-size:18px;font-weight:800;border-top:2px solid var(--ink);padding-top:8px;margin-top:4px}
.modal-bg{position:fixed;inset:0;background:rgba(15,22,38,.55);display:flex;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto;z-index:50}
.modal{background:var(--bg);border-radius:16px;padding:20px;width:100%;max-width:640px}
.modal.wide{max-width:900px}
.modal h2{margin:0 0 14px;font-size:19px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:10px;z-index:80;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.banner{background:var(--red-soft);color:var(--red);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-weight:600}
.banner.info{background:var(--blue-soft);color:var(--blue)}
.drop{border:2px dashed #c9c2b1;border-radius:var(--r);padding:26px;text-align:center;background:#fffdf8}
.drop.over{border-color:var(--amber);background:var(--amber-soft)}
.mnav{display:none}
/* quote sheet – mẫu Elmall */
.sheet{background:#fff;width:794px;padding:34px 46px 40px;color:#000;font-family:"Tinos","Times New Roman",serif;font-size:13.5px;line-height:1.35;margin:0 auto}
.sheet .hd{display:flex;gap:10px;align-items:center}
.sheet .hd img{width:190px;flex:none}
.sheet .co{text-align:right;color:#e3001b;font-weight:700;font-size:12.2px;line-height:1.45}
.sheet .co .blue{color:#1f4e9c}
.sheet .sr{display:grid;grid-template-columns:1fr 1fr;gap:0 18px;color:#e3001b;font-size:11.5px;margin:10px 0 6px;line-height:1.45}
.sheet .rule{border-top:3px solid #000;border-bottom:1px solid #000;height:5px;margin:4px 0 6px}
.sheet .brands{width:100%;display:block}
.sheet h2{text-align:center;font-size:20px;margin:12px 0 0;font-weight:700}
.sheet .date{text-align:right;font-style:italic;margin:2px 30px 8px 0}
.sheet .to div{margin:1px 0}
.sheet table.q{border-collapse:collapse;width:100%;margin-top:4px}
.sheet table.q th{border:1px solid #000;font-size:13px;font-weight:700;padding:5px 3px;text-align:center;color:#000;text-transform:none;letter-spacing:0;background:#fff}
.sheet table.q td{border:1px solid #000;padding:4px 4px;font-size:12.6px;vertical-align:middle}
.sheet table.q td.c{text-align:center}.sheet table.q td.r{text-align:right}
.sheet table.q .tl{text-align:center;font-weight:700}
.sheet .img{width:100%;max-height:80px;object-fit:contain}
.sheet .sec{font-weight:700;margin:10px 0 1px;font-size:13.5px;display:block}
.sheet .red{color:#e3001b;font-weight:700}
.sheet .sign{display:flex;justify-content:flex-end;margin-top:22px;text-align:center;font-weight:700}
.preview-wrap{overflow:auto;background:#d9d5cb;padding:16px;border-radius:12px;max-height:70vh}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  aside{display:none}
  main{padding:16px 14px 96px}
  .kpis{grid-template-columns:1fr 1fr}
  .cols{grid-template-columns:1fr}
  .li{flex-wrap:wrap}.li .acts{width:100%;justify-content:flex-start;padding-left:19px}
  .grid2,.grid3{grid-template-columns:1fr}
  .steps{grid-template-columns:repeat(3,1fr)}
  .mnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--navy);z-index:40;justify-content:space-around;padding:6px 2px calc(6px + env(safe-area-inset-bottom))}
  .mnav button{background:none;border:0;color:#b9c4da;font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 2px;flex:1;position:relative}
  .mnav button .ic{font-size:19px}
  .mnav button.on{color:var(--amber);font-weight:700}
  .mnav .badge{position:absolute;top:0;right:18%;background:var(--red);color:#fff;font-size:10px;border-radius:9px;padding:0 5px}
  .lines .hide-m{display:none}
  .imgcell{display:none}
  .modal-bg{padding:10px 6px}
}
</style>
</head>
<body>
<div id="gate"></div>
<div class="app" hidden>
  <aside>
    <div class="brand"><div class="bulb"></div><div><b>ELMALL</b><small>Bàn làm việc kinh doanh</small></div></div>
    <div id="sidenav"></div>
    <div id="userbox"></div><div class="sync" id="sync"><i></i>Đang kết nối…</div>
  </aside>
  <main id="main"></main>
</div>
<nav class="mnav" id="mnav"></nav>
<div id="modal"></div>

<script src="vendor/firebase-app-compat.js"></script>
<script src="vendor/firebase-auth-compat.js"></script>
<script src="vendor/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script>

const STEPS=["Báo giá","Khách chốt","Đặt hàng NCC","Giao hàng","Thu tiền","Hoàn thành"];

const STUCK_DAYS=[2,1,3,2,3,999];
const CHUNK=200;
const DEFAULT_SETTINGS={
  markups:[], // % lãi thật lưu trong Firestore (settings/private) – chỉ quản lý đọc được
  defaultMarkup:0, vat:8, rounding:1000, projectDay:6, careDays:2,
  listDiscount:40, listDiscounts:[], // chiết khấu cho khách trên giá bìa (hàng nhập theo catalog)
  company:{name:"CÔNG TY CỔ PHẦN HỆ THỐNG CHIẾU SÁNG VÀ THIẾT BỊ ĐIỆN ELMALL",address:"Nhà số 3, đường số 5, Sunrise E, KĐT The Manor Central Park, Phường Định Công, TP Hà Nội",tax:"0111245527",website:"elmall.vn",hotline:"1900 2150",
    showrooms:"Showroom 1: The Manor Central Park, Nguyễn Xiển, Hà Nội\nKho hàng 1 : 32 Đại Từ, Hoàng Mai, Hà Nội.\nShowroom 2: 140 Võ Văn Kiệt, Q1, TP. HCM\nShowroom 3: 271 Lạch Tray, Ngô Quyền, Hải Phòng\nShowroom 4: 170 Điện Biên Phủ, Thanh Khê, Đà Nẵng\nShowroom 5: 585 Trần Hưng Đạo, Phường Quy Nhơn, Gia Lai.\nShowroom 6: 512 Nguyễn Văn Cừ, TP. Hạ Long\nShowroom 7: 411 Ngô Gia Tự. TP Bắc Ninh."},
  seller:{name:"Mr. Tuệ",phone:"0901.761.191-097.888.0434",email:"kd10@elmall.vn"},
  sections:{

    bankAccount:"330368999  mở tại Ngân hàng MB Chi nhánh Hà Nội",
    delivery:"Miễn phí giao hàng trong nội thành Hà Nội, Đà Nẵng, TP. Hồ Chí Minh với các đơn hàng có giá trị trên 5.000.000VNĐ",
    other:"Hàng đã giao miễn đổi và trả lại\nThời gian bảo hành: Theo quy định của nhà sản xuất đối với từng loại mặt hàng"}
};
const NAV=[
  {id:"today",ic:"☀️",t:"Hôm nay"},
  {id:"customers",ic:"👥",t:"Khách hàng",s:"Khách"},
  {id:"orders",ic:"📦",t:"Đơn hàng",s:"Đơn"},

function ctoks(s){const o=new Set();for(let t of norm(s).split(/[^a-z0-9.]+/)){t=t.replace(/^\.+|\.+$/g,"");if(t.length<2||CSTOP.has(t))continue;if(/^0?\d{2,3}$/.test(t)){const v=parseInt(t,10);if(v>=50&&v<=300)t="d"+v}o.add(t)}return o}

  if(/[a-z]/.test(t)&&/\d/.test(t)&&t.length>=4)return 5;if(/^\d{5}$/.test(t))return 5;if(/^[a-z]+$/.test(t)&&t.length>=4)return 2;if(/^[a-z]{3}$/.test(t))return 1;return 0.3}

  const b=norm(p.brand);let best=0,src="";
  if(b){const pt=[...ctoks([p.name,p.model].join(" "))];const pc=norm(p.name).replace(/[^a-z0-9]/g,"");
    for(const e of CAT){if(!(b===e.b||b.includes(e.b)||e.b.includes(b)))continue;let sc=0,code=false,fam=false;
      for(const t of pt){const w=cw(t);if(e.T.has(t))sc+=w;else if(e.F.has(t))sc+=0.4*w;else continue;if(w>=5)code=true;if(w===2&&/^[a-z]+$/.test(t))fam=true}

    if(!id){id="custom-"+Date.now().toString(36)+ids.length;ids.push(id);S.catalog[id]=S.catalog[id]||{kind:"custom",items:[]}}

const keyOf=p=>norm(p.model||"")+"|"+norm(p.name||"")+"|"+norm(p.group||"");
async function replaceSeed(seedId,label,version,items,onProgress){

  items=items.map(it=>{const o=old.get(keyOf(it));const n={...it,seed:seedId,id:o?o.id:(it.id||uid())};
    if(o){if(Number(o.cost)!==Number(n.cost))n.history=[{cost:Number(o.cost)||0,supplier:o.supplier||"",date:o.quoteDate||""},...(o.history||[])].slice(0,6);else if(o.history)n.history=o.history;if(o.userNote)n.userNote=o.userNote}

const addDays=(s,n)=>{const d=new Date((s||todayStr())+"T00:00:00");d.setDate(d.getDate()+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const wdOf=s=>new Date(s+"T00:00:00").getDay();

function dueTag(s){if(!s)return"";const t=todayStr();const cls=s<t?"red":s===t?"amb":"";return`<span class="tag ${cls}">${dayLabel(s)}</span>`}
function otag(x){return IS_ADMIN&&S.scope==="all"&&x&&x.owner&&x.owner!==ME.email?` <span class="otag">${esc(ownerName(x.owner))}</span>`:""}

function custOrders(c){return S.orders.filter(o=>o.customerId===c.id)}
function careDue(){const t=todayStr();return S.customers.filter(c=>c.nextCare&&c.nextCare<=t&&!c.archived).sort((a,b)=>a.nextCare.localeCompare(b.nextCare))}
function waitingQuotes(){return S.orders.filter(o=>o.status===0).sort((a,b)=>(a.createdAt||"").localeCompare(b.createdAt||""))}
function urgentOrders(){const t=todayStr(),out=[];
  for(const o of S.orders){if(o.status>=5||o.status===0&&!isLate(o)&&o.dueDate!==t)continue;const name=o.company||o.customer||"(chưa có tên khách)";
    if(isLate(o))out.push({o,lvl:0,title:`${o.code} · ${name}`,desc:`Quá hạn giao ${daysBetween(o.dueDate,t)} ngày · đang ở "${STEPS[o.status]}"`});
    else if(o.dueDate===t)out.push({o,lvl:1,title:`${o.code} · ${name}`,desc:`Hẹn giao hôm nay · đang ở "${STEPS[o.status]}"`});
    else{const since=(o.history&&o.history[o.status])||o.createdAt;if(since){const d=daysBetween(since,t);if(d>=STUCK_DAYS[o.status])out.push({o,lvl:2,title:`${STEP_HINT[o.status]} · ${o.code}`,desc:`${name} · ${d} ngày ở bước "${STEPS[o.status]}"`})}}}
  return out.sort((a,b)=>a.lvl-b.lvl)}
function isProjectDay(s){return wdOf(s||todayStr())===Number(S.settings.projectDay??6)}
function projectsToCare(){const t=todayStr();const act=S.projects.filter(p=>!["Đã chốt","Dừng"].includes(p.stage));

const CCT_SEQ=/\b\d{4}\s*K?(?:\s*[\/|,]\s*\d{4}\s*K?)+\b/i;
function cctOptions(src){if(!src)return[];const m=String(src).match(CCT_SEQ);if(!m)return[];
  return [...new Set(m[0].split(/[\/|,]/).map(x=>x.replace(/\s+/g,"").toUpperCase().replace(/^(\d{4})K?$/,"$1K")).filter(x=>/^\d{4}K$/.test(x)))]}
function lineCctOpts(it){if(it.cctOpts&&it.cctOpts.length>1)return it.cctOpts;const o=cctOptions(it.cct);return o.length>1?o:cctOptions(it.nameOrig||it.name)}

async function makePdf(o){const msg=$("#pdfmsg"),btn=$("#dlpdf");btn.disabled=true;msg.textContent="Đang tạo PDF…";

    const img=canvas.toDataURL("image/jpeg",0.93);let y=0;pdf.addImage(img,"JPEG",0,0,W,ih);let left=ih-H;

    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);msg.textContent="Đã tải "+name;
  }catch(e){msg.textContent=e&&e.code==="declined"?"Đã hủy tải.":"Lỗi tạo PDF: "+(e&&(e.message||e.code)||e)}finally{btn.disabled=false}}

function parseSupplierSheets(sheets,opt){const all=sheets.map(s=>s.rows.map(r=>r.map(cleanTxt).join(" ")).join("\n")).join("\n");const N=norm(all);

    return{kind:"Rạng Đông",rows,supplier:"NPP Rạng Đông",brand:"Rạng Đông",vatIncl:true,replace:true}}
  const rows=[];let brandGuess="";if(N.includes("panasonic"))brandGuess="Panasonic";else if(N.includes("mpe"))brandGuess="MPE";else if(N.includes("philips"))brandGuess="Philips";
  for(const sh of sheets){let cols=null,group=cleanTxt(sh.name);
    for(const r of sh.rows){const cells=r.map(cleanTxt);const low=cells.map(norm);const line=low.join(" ");

function autoSpecs(name){const o={};let m=name.match(/(?:^|[^\w/])(\d+(?:[.,]\d+)?)\s*[wW](?![a-zA-Z0-9])/)||name.match(/\/(\d+(?:[.,]\d+)?)\s*W/);if(m)o.power=m[1].replace(",",".")+"W";

  if(k.length)o.cct=[...new Set(k)].join(" / ");else if(/doi mau|3 che do/.test(n))o.cct="Đổi màu 3 chế độ";else if(/anh sang trang|\bast\b/.test(n))o.cct="Trắng";else if(/anh sang vang|\basv\b/.test(n))o.cct="Vàng";
  m=name.match(/(\d+(?:[.,]\d+)?)\s*[xX×]\s*(\d+(?:[.,]\d+)?)(?:\s*[xX×]\s*\d+)?\s*(mm|cm)?/);if(m)o.size=m[0].replace(/\s/g,"");else{m=name.match(/(?:fi|Φ|Ø|φ)\s*(\d+)/i)||name.match(/\b(\d{2,3})\/\d+(?:[.,]\d+)?W/);if(m&&Number(m[1])>=40)o.size="Ø"+m[1]+"mm"}
  return o}

for(const s of seeds){impStatus(`Đang đưa ${s.label} lên kệ…`);n+=await replaceSeed(s.id,s.label,s.version,s.items,(i,t)=>impStatus(`Đang đưa ${s.label} lên kệ (${i}/${t})…`))}

const CFIELD=[["stt",/^(stt|tt|so tt)$/],["name",/^(ho ten|ho va ten|ten|ten khach|ten kh|khach hang|nguoi lien he|lien he)$/],["address",/dia chi/],["company",/don vi|cong ty|to chuc|doanh nghiep/],
  ["phone",/dien thoai|^sdt|so dt|phone|mobile|^dt$/],["email",/gmail|email|e-mail|^mail/],["lastContact",/time|lien lac|^ll|ngay/],["note",/ghi chu|note/]];
const CLABEL={stt:"STT",name:"Họ tên",address:"Địa chỉ",company:"Đơn vị",phone:"Điện thoại",email:"Gmail",lastContact:"Liên lạc gần nhất",note:"Ghi chú"};
function phoneClean(v){if(v==null||v==="")return"";let s=typeof v==="number"?String(Math.round(v)):String(v);const d=s.replace(/[^\d+]/g,"");if(!d)return String(v).trim();
  let x=d.replace(/^\+?84/,"0");if(/^[1-9]\d{8}$/.test(x))x="0"+x;return x}
function toISODate(v){if(v instanceof Date&&!isNaN(v))return v.getFullYear()+"-"+String(v.getMonth()+1).padStart(2,"0")+"-"+String(v.getDate()).padStart(2,"0");
  const m=String(v||"").trim().match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/);if(m)return`${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;return""}
function custExtraCols(){const seen=[];for(const c of S.customers)for(const k of (c.extraOrder||Object.keys(c.extra||{})))if(!seen.includes(k))seen.push(k);return seen}
function custImport(){
  openModal(`<div class="modal wide"><div class="row"><h2 class="grow">Nhập khách hàng từ Excel</h2><button class="btn ghost" data-close>✕</button></div>
  <p class="specs">File Excel có dòng tiêu đề (Họ tên, Đơn vị, Điện thoại, Gmail, Địa chỉ, Ghi chú, Liên lạc gần nhất…). Các cột khác cũng được giữ nguyên.</p>
  <div class="drop" id="cdrop" style="margin-top:8px"><b>Kéo thả file Excel vào đây</b> hoặc <label style="color:var(--blue);cursor:pointer;font-weight:700">chọn file<input type="file" id="cfile" accept=".xlsx,.xls,.csv" hidden></label></div>
  <div id="cprev" style="margin-top:12px"></div></div>`);
  const dz=$("#cdrop");dz.ondragover=e=>{e.preventDefault();dz.classList.add("over")};dz.ondragleave=()=>dz.classList.remove("over");
  dz.ondrop=e=>{e.preventDefault();dz.classList.remove("over");const f=e.dataTransfer.files[0];if(f)readCustFile(f)};
  $("#cfile").onchange=e=>{const f=e.target.files[0];if(f)readCustFile(f)}}
async function readCustFile(f){const el=$("#cprev");el.innerHTML=`<p class="specs">Đang đọc ${esc(f.name)}…</p>`;
  try{await loadScript("vendor/xlsx.full.min.js");const wb=XLSX.read(await f.arrayBuffer(),{type:"array"});
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:""});
    let h=-1;for(let i=0;i<Math.min(15,rows.length);i++){const n=rows[i].map(x=>norm(String(x)));if(n.filter(Boolean).length>=2&&n.some(x=>CFIELD.slice(1).some(([,re])=>re.test(x)))){h=i;break}}
    if(h<0){el.innerHTML=`<div class="banner">Không tìm thấy dòng tiêu đề (cần có cột như "Họ tên", "Điện thoại"…).</div>`;return}
    const head=rows[h];const width=Math.max(...rows.slice(h).map(r=>r.length));const map=[];const used=new Set();
    for(let j=0;j<width;j++){const raw=String(head[j]??"").trim();const n=norm(raw);const fld=CFIELD.find(([k,re])=>!used.has(k)&&re.test(n));
      if(fld){used.add(fld[0]);map[j]={field:fld[0],label:raw}}else{const hasData=rows.slice(h+1).some(r=>String(r[j]??"").trim());if(raw||hasData)map[j]={extra:raw||("Cột "+XLSX.utils.encode_col(j)),label:raw||("Cột "+XLSX.utils.encode_col(j))}}}
    const recs=[];const extraOrder=map.filter(m=>m&&m.extra).map(m=>m.extra);
    for(const r of rows.slice(h+1)){const o={extra:{}};let any=false;
      map.forEach((m,j)=>{if(!m)return;let v=r[j];if(v===""||v==null)return;
        if(m.field==="phone")v=phoneClean(v);else if(m.field==="lastContact"){if(typeof v==="number"&&v>20000&&v<80000){const p=XLSX.SSF.parse_date_code(v);v=`${p.y}-${String(p.m).padStart(2,"0")}-${String(p.d).padStart(2,"0")}`}const d=/^\d{4}-\d{2}-\d{2}$/.test(v)?v:toISODate(v);if(d)v=d;else{o.extra[m.label]=String(v);any=true;return}}
        else if(m.field==="stt")v=Number(v)||String(v);else if(v instanceof Date)v=toISODate(v);else v=typeof v==="number"?String(v):String(v).trim();
        if(m.field){o[m.field]=v;if(m.field!=="stt")any=true}else{o.extra[m.extra]=v;any=true}});
      if(!any)continue;o.extraOrder=extraOrder;recs.push(o)}
    // gộp dòng trùng SĐT trong file
    const byPhone=new Map(),list=[];for(const o of recs){const p=normPhone(o.phone);if(p&&byPhone.has(p)){const a=byPhone.get(p);for(const k of ["name","company","email","address"])if(!a[k]&&o[k])a[k]=o[k];
        if(o.note&&o.note!==a.note)a.note=[a.note,o.note].filter(Boolean).join(" | ");if(o.lastContact&&(!a.lastContact||o.lastContact>a.lastContact))a.lastContact=o.lastContact;Object.assign(a.extra,o.extra);a._dup=(a._dup||0)+1}
      else{if(p)byPhone.set(p,o);list.push(o)}}
    const ckey=c=>c.phone?"p:"+normPhone(c.phone):"n:"+norm([c.name,c.company,c.email,c.note].join("|"));
    const exist=new Map(S.customers.map(c=>[ckey(c),c]));let nNew=0,nUpd=0;list.forEach(o=>{const e=exist.get(ckey(o));o._match=e?e.id:"";if(e)nUpd++;else nNew++});
    S.custImp={list,map:map.filter(Boolean)};
    const cols=map.filter(Boolean);
    el.innerHTML=`<div class="card" style="padding:10px 12px"><b>${list.length}</b> khách · <span class="tag green">${nNew} mới</span> <span class="tag blue">${nUpd} đã có (trùng SĐT / trùng tên)</span>${recs.length>list.length?` · gộp ${recs.length-list.length} dòng trùng SĐT trong file`:""}
      <div class="specs" style="margin-top:6px">Cột nhận ra: ${cols.map(m=>m.field?`<b>${esc(m.label||CLABEL[m.field])}</b> → ${CLABEL[m.field]}`:`<b>${esc(m.label)}</b> (giữ nguyên)`).join(" · ")}</div></div>
      <div class="row" style="margin-top:10px;gap:14px;flex-wrap:wrap">
        <label class="row" style="gap:6px;font-size:14px"><input type="checkbox" id="cupd" checked style="width:auto"> Khách đã có: bổ sung thông tin còn thiếu (không tạo trùng)</label>
        ${IS_ADMIN&&S.users.length?`<label class="f" style="display:flex;gap:6px;align-items:center">Giao cho <select id="cowner" style="width:auto">${[{id:ME.email,name:"Tôi"},...S.users.filter(u=>u.id!==ME.email&&u.active!==false)].map(u=>`<option value="${esc(u.id)}">${esc(u.name||u.id)}</option>`).join("")}</select></label>`:""}</div>
      <div class="tbl-wrap card" style="margin-top:10px;padding:4px;max-height:320px;overflow:auto"><table><thead><tr>${cols.map(m=>`<th>${esc(m.label||CLABEL[m.field])}</th>`).join("")}</tr></thead><tbody>
      ${list.slice(0,30).map(o=>`<tr>${cols.map(m=>`<td style="font-size:13px">${esc(m.field?(m.field==="lastContact"&&o.lastContact?fmtD(o.lastContact):o[m.field]??""):(o.extra[m.extra]??""))}</td>`).join("")}</tr>`).join("")}</tbody></table>
      ${list.length>30?`<p class="specs" style="padding:6px">… và ${list.length-30} khách nữa</p>`:""}</div>
      <div class="row" style="justify-content:flex-end;margin-top:12px"><span class="specs grow" id="cimsg"></span><button class="btn" data-close>Hủy</button><button class="btn pri" id="cimgo">Nhập ${list.length} khách</button></div>`;
    $("#modal").querySelectorAll("[data-close]").forEach(b=>b.onclick=closeModal);$("#cimgo").onclick=commitCustImport}
  catch(e){el.innerHTML=`<div class="banner">Lỗi đọc file: ${esc(e.message||e)}</div>`}}
async function commitCustImport(){const {list}=S.custImp;const btn=$("#cimgo");btn.disabled=true;const owner=($("#cowner")&&$("#cowner").value)||ME.email;const upd=$("#cupd")?$("#cupd").checked:true;
  const ops=[];for(const o of list){const body={};for(const k of ["stt","name","company","phone","email","address","note","lastContact"])if(o[k]!==undefined&&o[k]!=="")body[k]=o[k];
    if(Object.keys(o.extra).length){body.extra=o.extra;body.extraOrder=o.extraOrder}
    if(o._match){if(!upd)continue;const c=S.customers.find(x=>x.id===o._match);const u={};for(const [k,v] of Object.entries(body)){if(k==="extra")u.extra={...(c.extra||{}),...v};else if(k==="note"&&c.note&&c.note!==v)u.note=c.note.includes(v)?c.note:c.note+" | "+v;else if(!c[k])u[k]=v}
      if(Object.keys(u).length)ops.push({ref:FS.collection("customers").doc(o._match),upd:u})}
    else ops.push({ref:FS.collection("customers").doc(),set:{...body,owner,tag:"Tiềm năng",nextCare:"",createdAt:nowIso(),log:[]}})}
  try{for(let i=0;i<ops.length;i+=400){const b=FS.batch();for(const op of ops.slice(i,i+400)){if(op.set)b.set(op.ref,op.set);else b.update(op.ref,op.upd)}
      $("#cimsg").textContent=`Đang lưu ${Math.min(i+400,ops.length)}/${ops.length}…`;await b.commit()}
    toast(`Đã nhập ${ops.length} khách`);S.custImp=null;closeModal();S.custFilter="all";viewCustomers()}
  catch(e){$("#cimsg").textContent="Lỗi: "+(e.code==="permission-denied"?"không có quyền":(e.message||e.code));btn.disabled=false}}
async function custExport(){try{await loadScript("vendor/xlsx.full.min.js");const ex=custExtraCols();
  const rows=S.customers.slice().sort((a,b)=>(Number(a.stt)||1e9)-(Number(b.stt)||1e9)).map((c,i)=>{const r={"STT":c.stt||i+1,"Họ tên":c.name||"","Địa chỉ":c.address||"","Đơn vị":c.company||"","Điện thoại":c.phone||"","Gmail":c.email||"","Liên lạc gần nhất":c.lastContact?fmtD(c.lastContact):"","Ghi chú":c.note||""};

  const ws=XLSX.utils.json_to_sheet(rows);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Khách hàng");XLSX.writeFile(wb,`Khach-hang-Elmall-${todayStr()}.xlsx`);toast("Đã xuất "+rows.length+" khách")}

async function upsertCustomerFromDraft(d,isNewQuote){if(!d.customer&&!d.company&&!d.phone)return;
  const ph=normPhone(d.phone);let c=d.customerId&&S.customers.find(x=>x.id===d.customerId);
  if(!c&&ph)c=S.customers.find(x=>normPhone(x.phone)===ph);
  if(!c)c=S.customers.find(x=>norm(x.company)===norm(d.company)&&norm(x.name)===norm(d.customer));
  const T=orderTotals(d);const entry={date:todayStr(),result:"Đã gửi báo giá",text:`Báo giá ${d.code} – ${money(T.total)}đ`};
  if(c){const upd={};for(const [k,v] of [["name",d.customer],["company",d.company],["phone",d.phone],["email",d.email],["address",d.address]])if(v&&!c[k])upd[k]=v;
    if(d.careDate!==undefined)upd.nextCare=d.careDate;if(isNewQuote){upd.log=[entry,...(c.log||[])].slice(0,40);upd.lastQuote=todayStr();if(!c.tag||c.tag==="Tiềm năng")upd.tag="Đang báo giá"}
    await db.doc("customers/"+c.id).update(upd);d.customerId=c.id}
  else{const ref=await db.collection("customers").add({name:d.customer||"",company:d.company||"",phone:d.phone||"",email:d.email||"",address:d.address||"",tag:"Đang báo giá",nextCare:d.careDate||"",lastQuote:todayStr(),createdAt:nowIso(),log:[entry]});d.customerId=ref.id}}

  const draw=()=>{$("#rtl").innerHTML=list.map((r,i)=>`<div class="card" style="margin-bottom:8px;padding:10px"><div class="row"><input data-rt="${i}" value="${esc(r.text)}" class="grow" style="width:auto" placeholder="VD: Training nhân viên mới"><button type="button" class="btn sm ghost danger" data-rtx="${i}">✕</button></div>
    <div class="chips" style="margin-top:8px">${[1,2,3,4,5,6,0].map(d=>`<button type="button" class="chip ${r.days.includes(d)?"on":""}" data-rtd="${i}:${d}">${WD[d].replace("Thứ ","T").replace("Chủ nhật","CN")}</button>`).join("")}</div></div>`).join("")||`<div class="empty sm">Chưa có việc định kỳ.</div>`;
    $("#rtl").querySelectorAll("[data-rt]").forEach(x=>x.oninput=()=>list[x.dataset.rt].text=x.value);
    $("#rtl").querySelectorAll("[data-rtx]").forEach(x=>x.onclick=()=>{list[x.dataset.rtx]._del=true;list.splice(x.dataset.rtx,1);draw()});
    $("#rtl").querySelectorAll("[data-rtd]").forEach(x=>x.onclick=()=>{const [i,d]=x.dataset.rtd.split(":").map(Number);const a=list[i].days;const k=a.indexOf(d);if(k>=0)a.splice(k,1);else a.push(d);draw()})};
  openModal(`<div class="modal"><div class="row"><h2 class="grow">Việc định kỳ hằng tuần</h2><button class="btn ghost" data-close>✕</button></div>
  <p class="specs">Việc lặp lại theo thứ trong tuần sẽ tự hiện ở màn Hôm nay. Hỏi thăm dự án đã tự nhắc vào ${WD[Number(S.settings.projectDay??6)]} (đổi trong Cài đặt).</p>
  <div id="rtl"></div><button class="btn sm" id="rtadd">+ Thêm việc</button>
  <div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn" data-close>Hủy</button><button class="btn pri" id="rtsave">Lưu</button></div></div>`);
  draw();$("#rtadd").onclick=()=>{list.push({text:"",days:[wdOf(todayStr())]});draw()};
  $("#rtsave").onclick=async()=>{const keep=list.filter(r=>r.text.trim()&&r.days.length);const ids=new Set(keep.map(r=>r.id).filter(Boolean));
    const ok=await save(async()=>{for(const r of S.routines)if(!ids.has(r.id))await db.doc("routines/"+r.id).delete();
      for(const r of keep){const body={text:r.text.trim(),days:r.days.sort(),doneOn:r.doneOn||""};if(r.id)await db.doc("routines/"+r.id).set(body);else await db.collection("routines").add(body)}},"Đã lưu việc định kỳ");if(ok)closeModal()}}

/* ================= Hộp thoại ================= */
function openModal(html){$("#modal").innerHTML=`<div class="modal-bg">${html}</div>`;$("#modal").querySelectorAll("[data-close]").forEach(b=>b.onclick=closeModal);$("#modal .modal-bg").onclick=e=>{if(e.target.classList.contains("modal-bg"))closeModal()}}
function closeModal(){$("#modal").innerHTML=""}
function confirmBox(title,text,onYes){openModal(`<div class="modal" style="max-width:400px"><h2>${esc(title)}</h2><p>${esc(text)}</p><div class="row" style="justify-content:flex-end"><button class="btn" data-close>Thôi</button><button class="btn pri" id="cyes" style="background:var(--red);border-color:var(--red)">Đồng ý</button></div></div>`);$("#cyes").onclick=()=>{closeModal();onYes()}}
window.addEventListener("resize",fitSheet);

/* ================= Khởi động ================= */
(function(){const h=(location.hash||"").slice(1);if(NAV.some(n=>n.id===h))S.view=h;if(S.view==="quote")S.view="today";loadCat();startApp()})();
</script>
</body>
